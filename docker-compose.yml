# Demo stack on the laptop: the legacy database and the API.
# Only the api service is rebuilt on a release; db keeps its data.
#   docker compose up -d --build            first start
#   ENGINE=service docker compose up -d --build api     redeploy API with the new engine
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: loandb
      POSTGRES_HOST_AUTH_METHOD: trust      # local demo only
    ports:
      - "5433:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro   # runs 01..05 on first start only
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loandb"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres@db:5432/loandb
      ENGINE: ${ENGINE:-legacy}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
